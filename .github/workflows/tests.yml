name: Booking regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: topform
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: topform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://topform:test-only@127.0.0.1:5432/topform_test
