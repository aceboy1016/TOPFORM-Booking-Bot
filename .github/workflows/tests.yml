name: Booking regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Start local Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8681 --project=topform-test --quiet > /tmp/firestore.log 2>&1 &
          python - <<'PY'
          import socket,time
          for _ in range(60):
              try:
                  with socket.create_connection(('127.0.0.1',8681),timeout=1): break
              except OSError: time.sleep(1)
          else: raise RuntimeError('Firestore emulator did not start')
          PY
      - run: python -m pytest -q
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8681
          TEST_FIRESTORE: '1'
