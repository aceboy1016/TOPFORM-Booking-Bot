# Switching production traffic stays a deliberate act (docs/ROLLOUT.md).
# This workflow only makes that act visible and repeatable; it never runs on push.
name: Promote Cloud Run revision

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revision to serve 100% traffic, or "latest" for the newest ready one. Leave blank to only show the current traffic.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false
    env:
      PROJECT: topform-booking-bot
      SERVICE: topform-booking-bot
      REGION: asia-northeast1
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Show current traffic
        run: |
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='table(status.traffic[].revisionName,status.traffic[].percent,status.traffic[].tag)' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: List recent revisions
        run: |
          echo '### Recent revisions' >> "$GITHUB_STEP_SUMMARY"
          gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --sort-by=~metadata.creationTimestamp --limit=5 \
            --format='table(metadata.name,status.conditions.filter("type:Ready").extract(status).flatten(),metadata.creationTimestamp)' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resolve and verify the revision
        if: inputs.revision != ''
        run: |
          if [ "$REVISION" = latest ]; then
            REVISION=$(gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --sort-by=~metadata.creationTimestamp --limit=1 --format='value(metadata.name)')
            echo "Resolved latest to $REVISION"
          fi
          # Never send traffic to a revision that did not come up.
          gcloud run revisions describe "$REVISION" --project "$PROJECT" --region "$REGION" \
            --format=json > /tmp/revision.json
          python3 - <<'PY'
          import json,sys
          conditions=json.load(open('/tmp/revision.json'))['status']['conditions']
          ready=next((c for c in conditions if c['type']=='Ready'),None)
          if not ready or ready['status']!='True':
              sys.exit('Revision is not Ready: '+json.dumps(ready))
          PY
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
      - name: Send all traffic to the chosen revision
        if: inputs.revision != ''
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --to-revisions "$REVISION=100" --quiet
      - name: Show traffic after promotion
        if: inputs.revision != ''
        run: |
          echo '### Promoted' >> "$GITHUB_STEP_SUMMARY"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='table(status.traffic[].revisionName,status.traffic[].percent,status.traffic[].tag)' \
            | tee -a "$GITHUB_STEP_SUMMARY"
